name: Daily Scrape

on:
  schedule:
    - cron: '30 12 * * *'  # UTC 12:30 = Beijing 20:30, after 新闻联播 ends
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to scrape (YYYY-MM-DD), leave empty for today'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Scrape today's news
        env:
          SCRAPE_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$SCRAPE_DATE" ]; then
            # validate format to prevent injection
            if [[ ! "$SCRAPE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Invalid date format: $SCRAPE_DATE"
              exit 1
            fi
            node scraper/index.js "$SCRAPE_DATE"
          else
            node scraper/index.js
          fi

      - name: Build site
        run: node scraper/build-site.js

      - name: Commit and push content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update $(date +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: scrape
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
