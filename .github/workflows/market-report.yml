name: Daily Market Report

on:
  schedule:
    - cron: '0 8 * * 1-5'  # UTC 08:00 = Beijing 16:00, weekdays only
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: daily-markt-report/requirements.txt

      - working-directory: daily-markt-report
        run: pip install -r requirements.txt

      - name: Generate market report
        working-directory: daily-markt-report
        run: python main.py

      - name: Build index page
        working-directory: daily-markt-report
        run: python build_index.py

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-markt-report/output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update market report $(date +%Y-%m-%d)"
            git push
          fi
