name: XWLB Fetch Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate sources from GitHub runner
        run: |
          url_path="xinwenlianbo/20260909/"

          echo "=== 1. govopendata https (direct) ==="
          curl -s -o /tmp/p1 -w "HTTP %{http_code}, %{size_download}B\n" --max-time 20 "https://cn.govopendata.com/${url_path}" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0" || true

          echo "=== 2. govopendata http (plain) ==="
          curl -sL -o /tmp/p2 -w "HTTP %{http_code}, %{size_download}B\n" --max-time 20 "http://cn.govopendata.com/${url_path}" -H "User-Agent: Mozilla/5.0" || true

          echo "=== 3. r.jina.ai reader proxy ==="
          curl -s -o /tmp/p3 -w "HTTP %{http_code}, %{size_download}B\n" --max-time 60 "https://r.jina.ai/https://cn.govopendata.com/${url_path}" -H "User-Agent: Mozilla/5.0" || true

          echo "=== 4. allorigins raw proxy ==="
          curl -s -o /tmp/p4 -w "HTTP %{http_code}, %{size_download}B\n" --max-time 60 "https://api.allorigins.win/raw?url=https%3A%2F%2Fcn.govopendata.com%2F${url_path}" -H "User-Agent: Mozilla/5.0" || true

          echo "=== 5. mrxwlb root ==="
          curl -s -o /tmp/p5 -w "HTTP %{http_code}, %{size_download}B\n" --max-time 20 "http://mrxwlb.com/" -H "User-Agent: Mozilla/5.0" || true

          echo ""
          echo "=== body snippets ==="
          for i in 1 2 3 4 5; do
            echo "--- p$i first 400 chars ---"
            head -c 400 /tmp/p$i 2>/dev/null | tr '\n' ' ' || true
            echo ""
          done
        continue-on-error: true
