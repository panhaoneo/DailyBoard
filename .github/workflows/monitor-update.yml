name: Monitor Update

on:
  schedule:
    # 每周一 08:30 北京时间（UTC 00:30）— 由当前最高频指标（VLCC 运价，周度）决定
    - cron: '30 0 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: '说明: 手动触发一次全量更新（默认即可）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: monitor/requirements.txt

      - working-directory: monitor
        run: pip install -r requirements.txt

      - name: Build monitor pages
        working-directory: monitor
        run: python build.py

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monitor/docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update monitor $(date +%Y-%m-%d)"
            git push
          fi
