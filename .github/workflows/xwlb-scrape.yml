name: Daily XWLB Scrape

on:
  schedule:
    - cron: '30 12 * * *'  # UTC 12:30 = Beijing 20:30
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to scrape (YYYY-MM-DD), leave empty for today'
        required: false
        type: string

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xwlb/package-lock.json

      - working-directory: xwlb
        run: npm ci

      - name: Scrape news
        working-directory: xwlb
        env:
          SCRAPE_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$SCRAPE_DATE" ]; then
            if [[ ! "$SCRAPE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Invalid date format: $SCRAPE_DATE"
              exit 1
            fi
            node scraper/index.js "$SCRAPE_DATE"
          else
            node scraper/index.js
          fi

      - name: Build site
        working-directory: xwlb
        run: node scraper/build-site.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xwlb/content/ xwlb/docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update xwlb $(date +%Y-%m-%d)"
            git push
          fi
